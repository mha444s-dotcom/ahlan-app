name: Check and publish Ahlan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pull requests run the same checks, with no deployment credentials.
permissions:
  contents: read

jobs:
  build:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check publishable source files
        run: node maintenance/github/Check-Publish.cjs

      - name: Install locked build dependencies
        run: npm ci

      - name: Run clean-checkout tests
        run: npm run test:ci

      - name: Build the production artifact
        run: npm run build

      - name: Test the artifact in Chrome at a project subpath
        timeout-minutes: 10
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/browser-pages.cjs --local --root release/ahlan --base-path /ahlan-app/

      - name: Mark the exact source revision for live verification
        run: node maintenance/github/Stamp-Deployment.cjs

      - name: Upload only the production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: release/ahlan
          retention-days: 1

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Finish an active deployment before allowing another one to start.
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - name: Deploy the checked production artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
